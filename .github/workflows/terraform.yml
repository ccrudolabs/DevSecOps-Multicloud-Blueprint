name: Terraform CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  terraform:
    name: Terraform Format, Validate, Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Terraform files
        id: tf_files
        shell: bash
        run: |
          if find . -type f -name "*.tf" | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Terraform files found. Skipping Terraform validation for this change."
          fi

      - name: Setup Terraform
        if: steps.tf_files.outputs.found == 'true'
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format
        if: steps.tf_files.outputs.found == 'true'
        run: terraform fmt -check -recursive

      - name: Terraform Init
        if: steps.tf_files.outputs.found == 'true'
        run: terraform init

      - name: Terraform Validate
        if: steps.tf_files.outputs.found == 'true'
        run: terraform validate

      - name: Terraform Plan
        if: steps.tf_files.outputs.found == 'true'
        run: terraform plan -out=tfplan
